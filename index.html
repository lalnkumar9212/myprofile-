
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10294b">
<title>LKU | LWD Personal Portal</title>

<style>
:root{
  --navy:#10294b;
  --blue:#24558a;
  --bg:#f3f6fb;
  --white:#fff;
  --text:#1c2d43;
  --muted:#718096;
  --line:#e1e8f0;
  --soft:#eaf1f9;
  --shadow:0 3px 15px #152b4610;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;font-size:14px;
}
button,a{font:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
button:focus-visible,a:focus-visible{
  outline:3px solid #80b4f0;outline-offset:3px
}
.header{
  height:76px;background:var(--navy);color:white;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 25px;position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:44px;height:44px;border:2px solid #d5e3f5;
  border-radius:10px;display:grid;place-items:center;
  font-size:18px;font-weight:800;letter-spacing:-1px;
}
.brand-name{font-size:21px;font-weight:750;letter-spacing:.5px}
.brand-sub{font-size:11px;color:#cfdaea;margin-top:4px}
.header-right{display:flex;align-items:center;gap:12px}
.header-tag{
  padding:8px 12px;border:1px solid #ffffff35;
  border-radius:8px;color:#e7eef8;font-size:12px
}
.menu-toggle{
  display:none;background:transparent;color:white;
  border:1px solid #ffffff55;border-radius:8px;padding:9px 12px
}
.layout{
  display:grid;grid-template-columns:245px minmax(0,1fr);
  max-width:1600px;margin:auto;min-height:calc(100vh - 76px)
}
.sidebar{
  background:var(--white);border-right:1px solid var(--line);
  padding:23px 14px;display:flex;flex-direction:column;gap:5px;
}
.nav-heading{
  font-size:10px;font-weight:750;color:#8a97a9;
  letter-spacing:1.4px;padding:8px 13px 12px;
}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:13px;
  padding:12px 13px;border:0;border-radius:9px;
  color:#53637a;background:transparent;text-align:left;
  transition:background .15s,color .15s;
}
.nav-btn:hover{background:#f2f6fb}
.nav-btn.active{background:var(--soft);color:var(--navy);font-weight:700}
.nav-icon{font-size:18px;width:22px;text-align:center}
.sidebar-bottom{
  margin-top:auto;padding:16px 12px 4px;color:var(--muted);
  font-size:11px;line-height:1.7
}
.main{min-width:0;padding:28px}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:11px}
.page-heading{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;margin-bottom:24px;
}
.page-heading h1{font-size:26px;margin:0 0 8px;color:var(--navy)}
.page-heading p{margin:0;color:var(--muted);line-height:1.6}
.page-mark{
  min-width:48px;height:48px;border-radius:12px;
  background:var(--soft);display:grid;place-items:center;
  font-size:23px;color:var(--navy)
}
.panel{
  background:white;border:1px solid var(--line);
  border-radius:13px;padding:21px;box-shadow:var(--shadow);
  min-width:0;
}
.panel-title{font-size:16px;color:var(--navy);margin:0 0 17px}
.hero{
  background:linear-gradient(120deg,#10294b,#244d7d);
  border-radius:15px;padding:27px;color:white;
  display:flex;justify-content:space-between;align-items:center;
  gap:20px;margin-bottom:20px;overflow:hidden;
}
.hero h2{font-size:24px;margin:0 0 10px}
.hero p{color:#d5e1f1;line-height:1.7;margin:0;max-width:500px}
.hero-badge{
  width:86px;height:86px;flex-shrink:0;border:1px solid #ffffff65;
  background:#ffffff12;border-radius:20px;display:grid;place-items:center;
  font-size:29px;font-weight:bold;
}
.stats{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;margin-bottom:20px;
}
.stat{
  background:white;border:1px solid var(--line);
  padding:19px;border-radius:12px;box-shadow:var(--shadow);
}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat-icon{
  width:37px;height:37px;background:var(--soft);
  border-radius:10px;display:grid;place-items:center;font-size:18px;
}
.stat-label{color:var(--muted);font-size:12px}
.stat-number{font-size:26px;font-weight:750;color:var(--navy);margin-top:15px}
.stat-note{font-size:11px;color:var(--muted);margin-top:6px}
.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick-link{
  background:white;border:1px solid var(--line);border-radius:10px;
  text-align:left;padding:16px 13px;color:var(--text);
}
.quick-link:hover{background:#f5f8fc;border-color:#b8cce4}
.quick-link .q-icon{font-size:21px;display:block;margin-bottom:12px}
.quick-link strong{display:block;color:var(--navy);font-size:13px}
.quick-link small{display:block;color:var(--muted);margin-top:6px;line-height:1.5}
.profile-banner{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.avatar{
  width:100px;height:100px;border-radius:50%;object-fit:cover;
  border:4px solid white;box-shadow:0 0 0 1px var(--line);
  background:#eaf0f7;flex-shrink:0;
}
.avatar-fallback{
  display:grid;place-items:center;font-size:29px;font-weight:750;color:var(--navy)
}
.profile-banner h2{margin:0 0 7px;color:var(--navy);font-size:21px}
.profile-banner p{margin:0 0 5px;color:var(--muted);line-height:1.6}
.badge{
  display:inline-block;background:#eaf4ee;color:#267347;
  border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700
}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.info-item{padding:15px 5px;border-bottom:1px solid var(--line);min-width:0}
.info-label{
  display:block;color:var(--muted);font-size:11px;
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px
}
.info-value{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.info-value.empty-value{color:#9aa6b5;font-style:italic}
.record-list{display:grid;gap:12px}
.record{
  background:white;border:1px solid var(--line);
  border-radius:12px;padding:18px;display:flex;gap:14px;
  align-items:flex-start;
}
.record-icon{
  width:43px;height:43px;flex-shrink:0;background:var(--soft);
  color:var(--navy);display:grid;place-items:center;
  border-radius:11px;font-size:20px;
}
.record-body{min-width:0;flex:1}
.record h3{font-size:15px;margin:2px 0 7px;color:var(--navy)}
.record-meta{font-size:12px;color:var(--blue);margin-bottom:8px}
.record p{font-size:13px;color:var(--muted);line-height:1.7;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.record-link{display:inline-block;margin-top:10px;font-size:12px;font-weight:700}
.empty{
  padding:35px 20px;text-align:center;border:1px dashed #cbd7e5;
  background:#fff;border-radius:12px;color:var(--muted);line-height:1.8;
}
.empty-icon{font-size:30px;margin-bottom:10px}
.empty strong{display:block;color:var(--navy);font-size:15px;margin-bottom:5px}
.notice{
  background:#f4f8fd;border:1px solid #dce7f4;border-radius:10px;
  padding:14px;color:#53677f;line-height:1.7;font-size:12px;margin-bottom:18px
}
.qr-area{text-align:center;padding:22px}
.qr-area img{
  width:220px;height:220px;max-width:100%;object-fit:contain;
  display:block;margin:20px auto;border:1px solid var(--line);border-radius:10px;
}
.btn{
  display:inline-flex;justify-content:center;align-items:center;gap:7px;
  padding:10px 15px;border-radius:8px;border:1px solid var(--line);
  background:white;color:var(--navy);font-weight:650;
}
.btn:hover{background:var(--soft)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:white}
.btn-primary:hover{background:#1d426e}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.settings-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:18px;padding:17px 0;border-bottom:1px solid var(--line)
}
.settings-row:last-child{border-bottom:0}
.settings-row strong{display:block;color:var(--navy);margin-bottom:6px}
.settings-row p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
.footer{text-align:center;padding:26px 0 8px;color:#8995a5;font-size:11px}
.mobile-nav{display:none}
.mobile-drawer{display:none}
.no-print{}
@media(max-width:1050px){
  .layout{grid-template-columns:215px minmax(0,1fr)}
  .main{padding:22px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two-col{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:680px){
  .header{height:66px;padding:0 14px}
  .logo{width:39px;height:39px}
  .brand-name{font-size:19px}
  .brand-sub{font-size:10px}
  .header-tag{display:none}
  .menu-toggle{display:block}
  .layout{display:block;min-height:calc(100vh - 66px)}
  .sidebar{
    display:none;position:fixed;top:66px;bottom:62px;left:0;width:260px;
    z-index:30;overflow-y:auto;box-shadow:5px 0 22px #10294b20
  }
  .sidebar.open{display:flex}
  .main{padding:19px 13px 88px}
  .page-heading{margin-bottom:19px}
  .page-heading h1{font-size:23px}
  .page-mark{width:42px;min-width:42px;height:42px}
  .hero{padding:22px 18px}
  .hero h2{font-size:20px}
  .hero-badge{width:58px;height:58px;font-size:21px;border-radius:14px}
  .stats{gap:10px}
  .stat{padding:14px}
  .stat-number{font-size:23px}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{padding:16px}
  .profile-banner{gap:14px}
  .avatar{width:76px;height:76px}
  .profile-banner h2{font-size:18px}
  .info-grid{grid-template-columns:1fr}
  .info-item{padding:13px 2px}
  .record{padding:14px;gap:10px}
  .record-icon{width:37px;height:37px;font-size:17px}
  .mobile-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:white;border-top:1px solid var(--line);
    padding:6px 3px max(6px,env(safe-area-inset-bottom));
    justify-content:space-around;gap:2px;
  }
  .mobile-nav button{
    flex:1;min-width:0;border:0;background:transparent;
    border-radius:8px;padding:6px 2px;color:#65748a;font-size:10px;
  }
  .mobile-nav button span{display:block;font-size:19px;margin-bottom:4px}
  .mobile-nav button.active{color:var(--navy);background:var(--soft);font-weight:bold}
}
@media print{
  .header,.sidebar,.mobile-nav,.btn,.menu-toggle{display:none!important}
  .layout{display:block}.main{padding:0}
  body{background:white}.panel,.stat{box-shadow:none}
}
</style>
</head>

<body>
<header class="header">
  <div class="brand">
    <div class="logo">LK</div>
    <div>
      <div class="brand-name">LKU <span style="font-size:11px;color:#d1deef">/ LWD</span></div>
      <div class="brand-sub">PERSONAL PROFILE PORTAL</div>
    </div>
  </div>
  <div class="header-right">
    <span class="header-tag">PERSONAL DASHBOARD</span>
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false">☰ Menu</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="nav-heading">WORKSPACE</div>
    <nav id="sideNav" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom">
      <strong>LKU · LWD</strong><br>
      Personal Profile & Dashboard<br>
      Version 1.0
    </div>
  </aside>

  <main class="main">
    <div class="breadcrumb">LKU <span aria-hidden="true"> / </span><span id="crumb">Home</span></div>
    <div class="page-heading">
      <div>
        <h1 id="pageTitle">Home</h1>
        <p id="pageSubtitle">Welcome to your personal dashboard.</p>
      </div>
      <div class="page-mark" id="pageMark" aria-hidden="true">⌂</div>
    </div>
    <div id="content" aria-live="polite"></div>
    <footer class="footer">LKU / LWD · Personal Profile Portal · Information managed by the owner</footer>
  </main>
</div>

<nav class="mobile-nav" id="mobileNav" aria-label="Quick navigation"></nav>

<script>
"use strict";

/*
  CUSTOMIZE YOUR WEBSITE HERE.
  Edit these details in GitHub when you want to change information.
  Upload your photo to the repository root as profile.jpg.
*/

const SITE = {
  name: "LKU",
  displayName: "LWD",
  photo: "profile.jpg",
  email: "",
  phone: "",
  location: "",
  about: "Welcome to my personal profile portal.",
  website: "" // Optional: enter your published website URL here.
};

const DATA = {
  qualification: [
    // Example:
    // {title:"Course or Degree", institution:"School / College", year:"2026", details:"Additional information"}
  ],
  skills: [
    // Example: {title:"HTML & CSS", level:"Beginner", details:"Web development"}
  ],
  projects: [
    // Example: {title:"My Website", status:"In Progress", details:"Personal portfolio", link:"https://example.com"}
  ],
  documents: [
    // Example: {title:"Certificate", category:"Education", details:"Stored securely by owner", link:""}
  ],
  notes: [
    // Example: {title:"My Goals", details:"Write a short note here"}
  ],
  notifications: [
    {title:"Welcome to LKU", details:"Your personal dashboard is ready to use.", date:""}
  ]
};

const MENU = [
  {id:"home",name:"Home",icon:"⌂",subtitle:"Overview of your personal dashboard."},
  {id:"profile",name:"Profile",icon:"◉",subtitle:"Personal details and profile information."},
  {id:"qualification",name:"Qualification",icon:"▤",subtitle:"Education and qualification records."},
  {id:"skills",name:"Skills",icon:"✧",subtitle:"Skills and areas of knowledge."},
  {id:"projects",name:"Projects",icon:"▣",subtitle:"Projects and portfolio highlights."},
  {id:"documents",name:"Documents",icon:"▧",subtitle:"Document directory and references."},
  {id:"notes",name:"Notes",icon:"✎",subtitle:"Personal notes and important information."},
  {id:"notifications",name:"Notifications",icon:"♧",subtitle:"Updates and announcements."},
  {id:"qr",name:"QR Code",icon:"▦",subtitle:"QR code for your public profile."},
  {id:"settings",name:"Settings",icon:"⚙",subtitle:"Website details and information."}
];

const ICONS = {
  qualification:"▤",skills:"✧",projects:"▣",
  documents:"▧",notes:"✎",notifications:"♧"
};

let currentPage = "home";

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function safeURL(value){
  try{
    const u = new URL(value, window.location.href);
    if(u.protocol === "https:" || u.protocol === "http:") return u.href;
  }catch(e){}
  return "";
}

function initials(){
  return (SITE.displayName || SITE.name || "LK")
    .trim().split(/\s+/).slice(0,2)
    .map(x=>x.charAt(0)).join("").toUpperCase();
}

function photoHTML(className){
  const src = safeURL(SITE.photo);
  if(!src) return '<div class="avatar avatar-fallback">'+escapeHTML(initials())+'</div>';
  return '<img class="'+className+'" src="'+escapeHTML(src)+'" alt="Profile photo" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">' +
    '<div class="avatar avatar-fallback" style="display:none">'+escapeHTML(initials())+'</div>';
}

function navigate(id){
  if(!MENU.some(m=>m.id===id)) return;
  currentPage = id;
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("menuToggle").setAttribute("aria-expanded","false");
  renderNavigation();
  renderPage();
  window.scrollTo({top:0,behavior:"auto"});
}

function renderNavigation(){
  const itemHTML = MENU.map(m =>
    '<button type="button" class="nav-btn '+(currentPage===m.id?'active':'')+
    '" data-page="'+m.id+'" '+(currentPage===m.id?'aria-current="page"':'')+'>'+
    '<span class="nav-icon" aria-hidden="true">'+m.icon+'</span><span>'+escapeHTML(m.name)+'</span></button>'
  ).join("");

  document.getElementById("sideNav").innerHTML = itemHTML;

  const mobileItems = MENU.filter(m=>
    ["home","profile","projects","documents","settings"].includes(m.id)
  );
  document.getElementById("mobileNav").innerHTML = mobileItems.map(m=>
    '<button type="button" class="'+(currentPage===m.id?'active':'')+
    '" data-page="'+m.id+'" '+(currentPage===m.id?'aria-current="page"':'')+'>'+
    '<span aria-hidden="true">'+m.icon+'</span>'+escapeHTML(m.name)+'</button>'
  ).join("");
}

function statCard(label,number,icon,note){
  return '<div class="stat"><div class="stat-top"><span class="stat-label">'+label+
    '</span><span class="stat-icon">'+icon+'</span></div><div class="stat-number">'+number+
    '</div><div class="stat-note">'+note+'</div></div>';
}

function quickLink(m){
  return '<button type="button" class="quick-link" data-page="'+m.id+'">'+
    '<span class="q-icon" aria-hidden="true">'+m.icon+'</span><strong>'+escapeHTML(m.name)+
    '</strong><small>View '+escapeHTML(m.name.toLowerCase())+'</small></button>';
}

function homePage(){
  const total = DATA.qualification.length + DATA.skills.length +
    DATA.projects.length + DATA.documents.length;

  return '<section class="hero"><div><h2>Welcome to '+escapeHTML(SITE.name)+'</h2>'+
    '<p>Your personal information, qualifications, skills and projects — organized in one place.</p></div>'+
    '<div class="hero-badge">LK</div></section>'+
    '<div class="stats">'+
    statCard("Qualifications",DATA.qualification.length,"▤","Education records")+
    statCard("Skills",DATA.skills.length,"✧","Skills listed")+
    statCard("Projects",DATA.projects.length,"▣","Portfolio entries")+
    statCard("Documents",DATA.documents.length,"▧","Document records")+
    '</div>'+
    '<div class="two-col"><section class="panel"><h2 class="panel-title">Quick Access</h2>'+
    '<div class="quick-grid">'+MENU.filter(m=>m.id!=="home").map(quickLink).join("")+
    '</div></section><section class="panel"><h2 class="panel-title">Profile Overview</h2>'+
    '<div class="profile-banner">'+photoHTML("avatar")+
    '<div><h2>'+escapeHTML(SITE.displayName)+'</h2><p>'+escapeHTML(SITE.name)+
    ' Personal Portal</p><span class="badge">Profile</span></div></div>'+
    '<div class="info-item"><span class="info-label">Location</span><div class="info-value">'+
    (SITE.location?escapeHTML(SITE.location):'<span class="empty-value">Not provided</span>')+
    '</div></div><div class="info-item"><span class="info-label">Information entries</span>'+
    '<div class="info-value">'+total+'</div></div>'+
    '<div class="btn-row"><button class="btn btn-primary" type="button" data-page="profile">View Profile →</button></div>'+
    '</section></div>';
}

function infoItem(label,value){
  const content = value
    ? escapeHTML(value)
    : '<span class="empty-value">Not provided</span>';
  return '<div class="info-item"><span class="info-label">'+escapeHTML(label)+
    '</span><div class="info-value">'+content+'</div></div>';
}

function profilePage(){
  return '<section class="panel"><div class="profile-banner">'+
    photoHTML("avatar")+'<div><h2>'+escapeHTML(SITE.displayName)+
    '</h2><p>'+escapeHTML(SITE.name)+' Personal Profile</p><span class="badge">Personal Portal</span></div></div>'+
    '<h2 class="panel-title">Personal Information</h2><div class="info-grid">'+
    infoItem("Full Name",SITE.displayName)+
    infoItem("Display Name",SITE.displayName)+
    infoItem("Website",SITE.website)+
    infoItem("Email",SITE.email)+
    infoItem("Phone",SITE.phone)+
    infoItem("Location",SITE.location)+
    '</div><div style="margin-top:18px"><span class="info-label">ABOUT</span>'+
    '<div class="info-value" style="line-height:1.8">'+escapeHTML(SITE.about)+'</div></div></section>';
}

function recordCard(item,icon){
  const title = item.title || "Untitled";
  const meta = [item.institution,item.year,item.level,item.status,item.category,item.date]
    .filter(Boolean).join(" · ");
  const description = item.details || "";
  const link = safeURL(item.link || "");
  return '<article class="record"><div class="record-icon" aria-hidden="true">'+icon+
    '</div><div class="record-body"><h3>'+escapeHTML(title)+'</h3>'+
    (meta?'<div class="record-meta">'+escapeHTML(meta)+'</div>':'')+
    (description?'<p>'+escapeHTML(description)+'</p>':'')+
    (link?'<a class="record-link" href="'+escapeHTML(link)+'" target="_blank" rel="noopener noreferrer">Open link ↗</a>':'')+
    '</div></article>';
}

function listPage(id){
  const records = DAT
